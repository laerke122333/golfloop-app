name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      PING_TABLE: exercises

    steps:
      - name: Ping Supabase
        run: |
         curl --fail --silent --show-error --output /dev/null \
          "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/${{ env.PING_TABLE }}?select=id&limit=1" \
           -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
